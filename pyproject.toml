[project]
name = "stackone-ai"
version = "2.10.1"
description = "agents performing actions on your SaaS"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StackOne", email = "support@stackone.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.10.6",
  "httpx>=0.28.0",
  # fetch_tools() is the only route to a tool and talks MCP, so the client is
  # not optional: without it the SDK cannot do anything.
  "mcp>=1.3.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stackone_ai"]

# The sdist carried the whole dev tree — uv.lock, pnpm-lock.yaml, CLAUDE.md, .github/
# and the TypeScript mocks. A consumer building from source needs none of it.
[tool.hatch.build.targets.sdist]
include = ["stackone_ai", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# Per-framework adapters. Each is imported lazily inside the method that needs
# it, so installing the SDK does not drag in a framework you do not use.
[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
pydantic-ai = ["pydantic-ai-slim>=1.83.0"]
examples = [
  "langchain>=1.0.0",
  "langchain-openai>=1.1.14",
  "openai>=2.32.0",
  "pydantic-ai>=1.83.0",
  "python-dotenv>=1.0.1",
]
dev = [
  "hypothesis>=6.141.1",
  "langchain-core>=0.1.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.9.6",
  "ty>=0.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"examples/**.py" = ["E501", "F841", "E402"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]

[tool.coverage.run]
source = ["stackone_ai"]
branch = true
omit = ["stackone_ai/__init__.py", "**/py.typed"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.html]
directory = "coverage/html"

[tool.uv]
link-mode = "clone"
